<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Tower Defence</title>
    <link rel="stylesheet" href="stylw.css">
</head>
<body>
  <main id="game-layout">
    <!-- Game container (responsive flex) -->
    <section id="game-container">
      <canvas id="gameCanvas" width="800" height="600"></canvas>
    </section>

      <!-- Sidebar (desktop) or bottom bar (mobile) -->
    <section id="user_control" class="column"> 


        <div id="towers_container">
          <div class="towerCard" draggable="true" data-tower-type="archer">
            <h2>Archer Tower</h2>
            <p class="price">$100</p>
          </div>

          <div class="towerCard" draggable="true" data-tower-type="cannon">
            <h2>Cannon</h2>
            <p class="price">$200</p>
          </div>

          <div class="towerCard" draggable="true" data-tower-type="mage">
            <h2>Magic Tower</h2>
            <p class="price">$150</p>
          </div>
        </div>

        
        <div id="controls">
          <button id="start">Start</button>
          <button id="pause">⏸ </button>
        </div>
    </section>

  </main>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
